[workspace]
members = ["src-tauri"]
resolver = "2"

# 工作区级依赖版本收敛：各 crate 里写 `dep.workspace = true` 引用这里的版本，
# 升级一个库只改一处。理由与边界见 AGENTS.md §1.1。
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["NoteText contributors"]
license = "MIT"
description = "轻量级 Windows 桌面文本编辑器：Tauri 2 + Rust + Vue 3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# 优化 profile：开发期 debug 信息单独开关，发布期做体积与速度的折中。
# 不设 lto = true：全量 LTO 让每次 build 多等 30s+，而编辑器启动已 < 1s。
[profile.release]
panic = "abort"
codegen-units = 16
strip = "symbols"

[profile.dev]
# 反编 Tauri 依赖时栈会更深，默认 256 帧在 WebView 回调里不够用。
opt-level = 0
