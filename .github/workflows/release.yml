name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  release:
    name: 构建安装器并发版
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 出包前先过静态门禁：clippy 与前端类型检查编译期发现不了。
      - name: 静态门禁
        run: pwsh scripts/check.ps1 -Full

      - name: 构建 NSIS 安装器
        run: cargo tauri build --bundler nsis

      # 体积是回归信号：前端误引一个大包会让安装包翻倍，而本地不易察觉。
      - name: 校验产物
        shell: pwsh
        run: |
          $exe = 'src-tauri/target/release/NoteText.exe'
          if (-not (Test-Path $exe)) { throw "主程序不存在：$exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "NoteText.exe = $mb MB"
          if ($mb -gt 20) { throw "主程序异常偏大（$mb MB），检查是否误打包了资源" }

      - name: 建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
