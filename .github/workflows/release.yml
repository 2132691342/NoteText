name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  release:
    name: 构建 NSIS 安装器并发版
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 验证门禁由 CI workflow 覆盖，本流程只负责出包。
      - name: 装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          # Node 24 与锁文件版本一致。
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装前端依赖（含 tauri-cli）
        run: npm --prefix frontend ci

      # release profile 的编译产物与 CI 的 debug 产物不通用。
      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release

      - name: 缓存 NSIS 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/AppData/Local/tauri/NSIS
          key: nsis-3.13

      # generate_context! 在 Rust 编译期读取 frontend/dist。
      - name: 构建前端
        run: npm --prefix frontend run build

      # CLI 从仓库根向上定位 src-tauri/tauri.conf.json。
      - name: 构建 NSIS 安装器
        run: ./frontend/node_modules/.bin/tauri build --bundles nsis

      # 体积门禁按构成判处：exe 里除壳之外还有归档 / 压缩引擎与完整编码码表，都是纯代码。
      # 越界只有两种原因——符号没剥掉，或有大文件被 include_bytes! 打进来。
      - name: 校验产物
        shell: pwsh
        run: |
          $exe = 'target/release/NoteText.exe'
          if (-not (Test-Path $exe)) { throw "主程序不存在：$exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "主程序 NoteText.exe = $mb MB（前端资产 + Rust 壳 + 归档 / 编码引擎）"

          # 上限取当前 release profile（lto=fat / strip / 依赖 opt-level=z）实测值 + 15% 余量。
          if ($mb -gt 24) { throw "主程序异常偏大（$mb MB）：检查 strip / lto 配置，或是否有大文件被 include_bytes! 打包" }

          # 调试目录项非空说明符号没剥干净（只提示，不阻断）。
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
          $optOff = $peOff + 24
          $magic = [BitConverter]::ToUInt16($bytes, $optOff)
          if ($magic -eq 0x20B) {
            $debugDirOff = $optOff + 112 + 6 * 8
            $debugRva = [BitConverter]::ToUInt32($bytes, $debugDirOff)
            if ($debugRva -ne 0) {
              Write-Host "调试目录仍存在（RVA=$debugRva）：确认 strip 生效即可，不阻断"
            }
          }

          $setup = Get-ChildItem 'target/release/bundle/nsis' -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $setup) { throw '没有找到 NSIS 安装包' }
          $setup | ForEach-Object { Write-Host "安装包：$($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: 建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
