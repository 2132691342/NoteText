name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  release:
    name: 构建 NSIS 安装器并发版
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 验证门禁由 CI workflow 覆盖，本流程只负责出包。
      - name: 装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          # Node 24 与锁文件版本一致。
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装前端依赖（含 tauri-cli）
        run: npm --prefix frontend ci

      # release profile 的编译产物与 CI 的 debug 产物不通用。
      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: release

      - name: 缓存 NSIS 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/AppData/Local/tauri/NSIS
          key: nsis-3.13

      # generate_context! 在 Rust 编译期读取 frontend/dist。
      - name: 构建前端
        run: npm --prefix frontend run build

      # CLI 从仓库根向上定位 src-tauri/tauri.conf.json。
      - name: 构建 NSIS 安装器
        run: ./frontend/node_modules/.bin/tauri build --bundles nsis

      # 产物在 workspace 根的 target/ 下。
      - name: 校验产物
        shell: pwsh
        run: |
          $exe = 'target/release/NoteText.exe'
          if (-not (Test-Path $exe)) { throw "主程序不存在：$exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "NoteText.exe = $mb MB"
          if ($mb -gt 20) { throw "主程序异常偏大（$mb MB），检查是否误打包了资源" }

          $setup = Get-ChildItem 'target/release/bundle/nsis' -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $setup) { throw '没有找到 NSIS 安装包' }
          $setup | ForEach-Object { Write-Host "安装包：$($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: 建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
