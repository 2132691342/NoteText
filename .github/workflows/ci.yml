name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支上的新推送取消旧运行：全量门禁要几分钟，排对比跑完有用。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验证（rustfmt / check / clippy / 测试 / 前端构建）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          # 锁文件由 npm 11（Node 24）生成，CI 必须同版本，否则 npm ci 读锁文件会崩。
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 缓存 cargo 产物：编译是 CI 里最慢的一段。
      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 装前端依赖
        run: npm --prefix frontend ci

      # Tauri 的 generate_context! 会在 Rust 编译期读取 frontend/dist。
      - name: 构建前端
        run: npm --prefix frontend run build

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: 检查 Rust 编译
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: 运行 Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 运行链路测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --test chain_tests
