name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送取消旧运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验证（rustfmt / check / clippy / 测试 / 前端构建）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          # Node 24 与锁文件版本一致。
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 装前端依赖
        run: npm --prefix frontend ci

      # generate_context! 在 Rust 编译期读取 frontend/dist，前端构建必须先行。
      - name: 构建前端
        run: npm --prefix frontend run build

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: 检查 Rust 编译
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: 运行 Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 一条命令跑全部链路测试：七域各一个 chain_* 集成二进制，覆盖文件 / 大文件 / 大表格 /
      # 表格编辑 / 会话 / 批量 / 压缩 / 系统关联。改一个域只重编那一个二进制。
      - name: 运行链路测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 虚拟滚动窗口的计算在 gridScroll.ts：它被生产代码与脚本共用，
      # 脚本直接 import 生产模块，所以两边不会漂移。
      - name: 校验虚拟滚动窗口
        run: npm --prefix frontend run check:grid
